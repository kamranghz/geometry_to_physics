[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometry_to_physics"
version = "0.1.0"
description = "Reference-anchored geometry-to-physics error propagation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "trimesh>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
gpu = ["torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/geometry_to_physics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
